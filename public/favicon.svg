<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The portia mark. Kept in step with src/components/Mark.astro, which is the
       source; a favicon has no page to take currentColor from, so the mode-aware
       values are inlined behind a media query instead. -->
  <style>
    :root { --ink: #0E1116; --accent: #0C6B61; --canvas: #F4F6F9; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #F3F4F7; --accent: #2DD4BF; --canvas: #08090C; }
    }
  </style>
  <g stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.4 14.8 Q25.5 11.2 29.6 12.4"/>
    <path d="M22 17.2 Q27.2 16.4 30.2 19.4"/>
    <path d="M21.6 21 Q26.4 22.4 28.6 26"/>
    <path d="M19.4 23.6 Q22.4 26.4 23.2 30"/>
    <path d="M11.6 14.8 Q6.5 11.2 2.4 12.4"/>
    <path d="M10 17.2 Q4.8 16.4 1.8 19.4"/>
    <path d="M10.4 21 Q5.6 22.4 3.4 26"/>
    <path d="M12.6 23.6 Q9.6 26.4 8.8 30"/>
    <ellipse cx="16" cy="8.5" rx="5" ry="4.3" fill="var(--accent)"/>
    <circle cx="16" cy="18.6" r="6.2"/>
  </g>
  <circle cx="13.6" cy="18.2" r="2.15" fill="var(--ink)"/>
  <circle cx="18.4" cy="18.2" r="2.15" fill="var(--ink)"/>
  <circle cx="13" cy="17.55" r="0.78" fill="var(--canvas)"/>
  <circle cx="17.8" cy="17.55" r="0.78" fill="var(--canvas)"/>
</svg>
