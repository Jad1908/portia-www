# The three rows beside the swarm.
#
# The arc is: **measure · build on what was measured · get better at it.** Each
# is one short title and two short sentences.
#
# `formation` names the shape the point swarm settles into while that row is the
# one being read (`islands/PrincipleSwarm.tsx`). It is not a per-row decoration
# budget: there is **one** cloud of points on the page and it holds the same
# number of points in all three shapes, which is the section's argument — these
# are not three features, they are one body of facts seen three ways.
#
# The `index` is a position, never a rank: it is rendered in `ash` at 12px, it
# does not grow, and nothing here is sorted or coloured by weight. LANDING.md,
# "colour and prominence communicate kind, never rank".

- id: principle-01
  index: "01"
  group: principles
  formation: tables
  title: "Everything is measured."
  body: >-
    Every fact it works from is one it went and got. Nothing is inferred from a
    sample.

- id: principle-02
  index: "02"
  group: principles
  formation: pipeline
  title: "No hallucinations."
  body: >-
    Each step of the pipeline stands on something measured. Nothing is invented
    along the way.

- id: principle-03
  index: "03"
  group: principles
  formation: graph
  title: "Everything is remembered."
  body: >-
    Everything it learns joins what it already knows. The tenth question is
    easier than the first.
