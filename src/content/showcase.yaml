# The four views of the app, in the order the page argues them: **measure ·
# answer from what was measured · build on it · keep it.** The same arc as
# `principles.yaml`, with the charts added between the first two — the rows
# underneath this section are the words for what these captures are doing.
#
# Every image these entries name is an unretouched capture of the running app.
# Nothing here is a mockup and nothing is composited — LANDING.md → "The
# showcase", rule 1, which is the rule the whole section rests on.
#
# `tab` is a position in a row, never a rank: the four pills are one size, one
# weight and one colour, and the selected one is marked as *selected* rather
# than as *best*. `lede` is one or two short sentences — the same budget the
# rest of the page keeps, and for the same reason.
#
# `alt` describes what is on the screen and nothing else. It does not sell, and
# it does not name a number the screenshot does not itself show.

- id: measures
  order: 0
  tab: "Measures your data"
  lede: >-
    It reads, measures and understands every source you give it.
    Everything is grounded, nothing is hallucinated.
  altFull: >-
    The portia workspace. The bookings source's catalog entry fills the middle:
    a written summary of the table, a dated note, then every column with its
    type, its role, how much of it is null and how many distinct values it
    holds. In the right pane an indexing job is reading the five sources, and
    its note on bookings waits for Allow or Deny.
  cards:
    - alt: >-
        The sources and indexing pane with five sources ticked, each marked not
        indexed, and a button reading "Index 5 sources".
    - alt: >-
        The same pane one step later, each source marked not read and the button
        now reading "Interpret 5 sources".

- id: charts
  order: 1
  tab: "Charts your data"
  lede: >-
    Ask it anything. It answers in charts, drawn straight from your data.
  altFull: >-
    A line chart of booked EUR room revenue by stay month, one line per booking
    channel, open in a tab beside the chat that asked for it.
  cards:
    - alt: >-
        The chat turn behind the chart: the question, then the copilot
        describing the source, querying it and plotting the result, with a note
        that it kept to EUR because the project has no exchange rates.

- id: builds
  order: 2
  tab: "Builds the pipeline"
  lede: >-
    It builds every step of the pipeline on something measured.
  altFull: >-
    The pipeline canvas after a run. Three sources flow through staging and
    intermediate models into one hotel-month table. Below the canvas is that
    table's measured outcome: its inputs, its row count, its columns and a
    unique grain. The copilot's summary of the build is in the right pane.
  cards:
    - alt: >-
        The copilot asking how cancelled bookings should affect rooms sold in the
        hotel-month table, marked as waiting for you, with the first two of its
        answers visible.

- id: remembers
  order: 3
  tab: "Keeps what it learned"
  lede: >-
    It keeps everything it learns, so nothing starts from scratch.
  altFull: >-
    The knowledge graph by table. The five sources, the eight models built from
    them and the two groups the copilot recorded, with arrows tracing which
    table reads which and dashed lines where two sources share columns.
  # No crop. The graph fills its own frame edge to edge and a card in front of it
  # covers the thing the view exists to show — the one place where the layering
  # cost more than it bought.
  cards: []
